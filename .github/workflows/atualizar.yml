name: Atualizar jogos e classificações

on:
  schedule:
    - cron: "0 12 * * 4"
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/atualizar.py --selftest
      - run: python scripts/atualizar.py
      - name: Guardar alterações
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Atualizar jogos e classificações" && git push)
      - name: Guardar ficheiros de diagnóstico se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          if-no-files-found: ignore

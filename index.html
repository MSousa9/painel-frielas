<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Jogos</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--text:#1a1e2b;--muted:#7b7468;--line:#e8e2d8;--accent:#1d4fa8;--accent2:#6b3a1f;--gold:#f2c230;--on:#fff;--shadow:0 8px 30px rgba(40,30,20,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--card:#141b30;--text:#eef1f8;--muted:#94a0ba;--line:#243050;--accent:#6ea2ff;--accent2:#c4906a;--gold:#f2c230;--on:#0b1020;--shadow:0 8px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1222;--card:#141b30;--text:#eef1f8;--muted:#94a0ba;--line:#243050;--accent:#6ea2ff;--accent2:#c4906a;--gold:#f2c230;--on:#0b1020;--shadow:0 8px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto auto;width:60vw;height:60vw;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 18%,transparent),transparent);z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(-8vw,6vh) scale(1.1)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(10px,1.6vh,20px);padding:clamp(12px,2vw,28px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:58px;width:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(30,20,10,.25));transition:transform .5s cubic-bezier(.2,.8,.2,1)}.logo:hover{transform:rotate(-4deg) scale(1.06)}
.brand h1{font-size:clamp(18px,2.4vw,30px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{color:var(--muted);font-size:13px;margin-top:2px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:clamp(22px,3vw,38px);letter-spacing:-.02em}
.clock span{color:var(--muted);font-size:13px;text-transform:capitalize}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.7fr);gap:clamp(10px,1.6vw,22px);min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(16px,2vw,28px);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero{justify-content:space-between;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--accent) 10%,var(--card)))}
.hero .esc{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:700;font-size:13px}
.vs{display:grid;gap:6px;margin:14px 0;text-align:center}
.vs .t{font-size:clamp(18px,2.2vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.vs .x{color:var(--muted);font-size:13px;font-weight:600}
.meta{color:var(--muted);font-size:14px;text-align:center}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.count div{background:var(--bg);border-radius:14px;padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums}
.count b{display:block;font-size:clamp(20px,2.6vw,32px);letter-spacing:-.02em}
.count small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head h2{font-size:clamp(18px,2vw,26px);letter-spacing:-.02em}
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px;margin:-2px -2px 0}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 14px;position:relative;z-index:1;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:all .35s cubic-bezier(.2,.8,.2,1)}.tab:hover{color:var(--text);transform:translateY(-1px)}.tab.on{color:var(--on);border-color:transparent}.glide{position:absolute;left:0;top:0;width:0;border-radius:99px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent2)));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent);transition:transform .7s cubic-bezier(.34,1.3,.45,1),width .7s cubic-bezier(.34,1.3,.45,1);z-index:0;pointer-events:none}.count2{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;letter-spacing:.12em;font-size:13px;cursor:pointer;user-select:none}.arr{border:1px solid var(--line);background:var(--bg);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;transition:all .3s}.arr:hover{background:var(--accent);color:var(--on);transform:scale(1.08)}


.list{flex:1;display:grid;gap:10px;align-content:start;overflow:hidden;}#pTitle{transition:opacity .35s ease,transform .55s cubic-bezier(.16,1,.3,1),filter .35s}
.out{opacity:0;transform:translateX(calc(var(--d,1)*-24px));filter:blur(5px)}.pre{transition:none!important;opacity:0;transform:translateX(calc(var(--d,1)*24px));filter:blur(5px)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:10px 14px;}.row.leave{opacity:0;transform:translateX(calc(var(--d,1)*-34px)) scale(.97);transition:opacity .3s ease,transform .4s cubic-bezier(.5,0,.75,0)}@keyframes rowin{from{opacity:0;transform:translate(calc(var(--d,1)*46px),10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.date{text-align:center;line-height:1.1}
.date small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.date b{font-size:22px}
.teams{min-width:0}
.teams div{font-weight:600;font-size:clamp(14px,1.5vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .me{color:var(--accent);font-weight:800}
.teams small{color:var(--muted);font-size:12px}
.when{font-weight:800;font-size:clamp(16px,1.8vw,22px);font-variant-numeric:tabular-nums}
.res{background:linear-gradient(135deg,#1d4fa8,#6b3a1f);color:#fff;padding:6px 14px;border-radius:12px}
.rail{flex:1;min-height:0;display:flex;gap:28px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}.rail::-webkit-scrollbar{display:none}.rail.anim,.rail.drag{scroll-snap-type:none;scroll-behavior:auto}.rail.drag{cursor:grabbing;user-select:none}.slide{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;min-width:0}.slide h2{font-size:clamp(18px,2vw,26px);letter-spacing:-.02em;margin-bottom:12px}.slide .list{flex:1}.scrub{position:relative;flex:none;height:12px;margin-top:14px;border-radius:99px;background:var(--line);cursor:pointer;touch-action:none}.scrub i{position:absolute;left:0;top:0;height:100%;width:40px;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--accent2)));box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent);cursor:grab;will-change:transform}.scrub:hover i{filter:brightness(1.1)}.scrub.drag i{cursor:grabbing}
.progress{height:3px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:36ch;line-height:1.5}
footer{min-height:0}
.spons{display:flex;align-items:center;gap:12px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.track{display:flex;gap:14px;flex:none}
.track.run{animation:slide var(--dur,30s) linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.sp{flex:none;width:clamp(120px,13vw,190px);height:clamp(60px,9vh,96px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;place-items:center;padding:10px;transition:transform .3s}
.sp:hover{transform:translateY(-3px)}
.sp img{max-width:100%;max-height:100%;object-fit:contain}
.sp.add{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-size:13px;text-align:center;cursor:pointer}
.gear{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;opacity:.35;transition:opacity .3s}
.gear:hover{opacity:1}
dialog{margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);width:min(720px,94vw);max-height:90vh;padding:22px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
dialog h3{margin-bottom:12px}
dialog label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
dialog input[type=text],dialog textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace}
dialog textarea{height:170px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.b{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on)}
button.b.g{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs div{position:relative;width:90px;height:56px;background:#fff;border-radius:10px;display:grid;place-items:center;padding:4px}
.thumbs img{max-width:100%;max-height:100%}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#e5484d;color:#fff;cursor:pointer}
@media (max-width:760px){main{grid-template-columns:1fr;overflow:auto}body{overflow:auto}.app{height:auto;min-height:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.slide h2.ttl{display:flex;align-items:center;gap:12px;width:fit-content;cursor:pointer;outline:none}
.tt{background:linear-gradient(var(--gold),var(--gold)) 0 100%/0 3px no-repeat;padding-bottom:3px;transition:background-size .55s cubic-bezier(.16,1,.3,1)}
.ttl:hover .tt,.ttl:focus-visible .tt{background-size:100% 3px}
.more{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:0;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 6px 5px 12px;border-radius:99px;opacity:.8;transition:all .45s cubic-bezier(.16,1,.3,1)}
.more i{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on);font-size:14px;line-height:1;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.ttl:hover .more{opacity:1;transform:translateX(4px)}.ttl:hover .more i{transform:rotate(135deg) scale(1.15)}
.app{transition:transform .9s cubic-bezier(.76,0,.24,1),filter .9s}
body.det .app{transform:scale(.95);filter:blur(4px)}
.ring{position:fixed;inset:0;z-index:30;visibility:hidden;pointer-events:none;clip-path:circle(0px at var(--x,50%) var(--y,50%));transition:clip-path var(--t,.9s) cubic-bezier(.76,0,.24,1) var(--dl,0s)}
.r1{background:#f2c230;--t:.8s;--dl:0s}
.r2{z-index:31;background:linear-gradient(115deg,#5a2f17 0 43%,#fff 43% 47%,#1d4fa8 47% 100%);--t:.9s;--dl:.1s}
.detail{z-index:32;--t:1s;--dl:.22s;background:var(--bg);color:var(--text);overflow:hidden}
.detail::before{content:"";position:absolute;left:-12vw;top:-18vw;width:55vw;height:55vw;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent2) 16%,transparent),transparent);pointer-events:none}
body.prep .ring{transition:none!important}body.det .ring,body.det-out .ring,body.prep .ring{visibility:visible}
body.det .ring{clip-path:circle(var(--R,150vmax) at var(--x,50%) var(--y,50%))}
body.det .detail{pointer-events:auto}
body.det-out .r1{--dl:.24s}body.det-out .r2{--dl:.12s}body.det-out .detail{--dl:0s}
.dwrap{position:relative;height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:clamp(8px,1.6vh,16px);padding:calc(clamp(12px,2vw,28px) + env(safe-area-inset-top,0px)) clamp(12px,2vw,28px) calc(clamp(12px,2vw,28px) + env(safe-area-inset-bottom,0px))}
.dbar{display:flex;align-items:center;justify-content:space-between}
.dbrand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}.dbrand img{height:36px}
.dclose{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:10px 18px;font:700 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow);transition:all .3s}
.dclose span{display:inline-block;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.dclose:hover{background:var(--accent);color:var(--on)}.dclose:hover span{transform:rotate(90deg)}
.tmask{display:block;overflow:hidden;padding:0 0 .1em}
.dtitle{font-size:clamp(34px,6.4vw,78px);font-weight:900;letter-spacing:-.04em;line-height:1.02}
.ltr{display:inline-block}
.dcomp{color:var(--muted);font-size:14px;margin-top:6px}
.dline{height:5px;width:min(220px,40%);border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--accent));margin-top:10px;transform-origin:left}
body.det .ltr{animation:ltr .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.8s + var(--i)*35ms)}
body.det .dline{animation:grow 1s cubic-bezier(.16,1,.3,1) .95s both}
body.det .stag{animation:stag .75s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.8s + var(--i,0)*45ms)}
@keyframes ltr{from{transform:translateY(105%)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes stag{from{opacity:0;transform:translateY(18px)}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.tile small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.tile b{display:block;font-size:clamp(20px,2.6vw,34px);letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.tile em{font-style:normal;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;background:var(--line)}.dot.w{background:var(--accent)}.dot.d{background:var(--muted)}.dot.l{background:var(--accent2)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(10px,1.6vw,22px);min-height:0}
.dside{display:grid;grid-template-rows:1fr 1fr;gap:clamp(10px,1.6vw,22px);min-height:0}
.dpanel{padding:clamp(14px,1.6vw,22px)}.dpanel .tag{margin-bottom:10px}
.dscroll{flex:1;min-height:0;overflow-y:auto;display:grid;gap:8px;align-content:start;scrollbar-width:thin;padding-right:2px}
.dscroll .row{padding:8px 12px}
.row.nx{box-shadow:inset 4px 0 0 var(--gold)}.row.w{box-shadow:inset 4px 0 0 var(--accent)}.row.d{box-shadow:inset 4px 0 0 var(--muted)}.row.l{box-shadow:inset 4px 0 0 var(--accent2)}
.row.nx .teams small::before{content:"PRÓXIMO · ";color:var(--accent2);font-weight:800}
.row.w .teams small::before{content:"VITÓRIA · ";color:var(--accent);font-weight:800}
.row.d .teams small::before{content:"EMPATE · ";font-weight:800}
.row.l .teams small::before{content:"DERROTA · ";color:var(--accent2);font-weight:800}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:0 6px 2px}
.tbl td{background:var(--bg);padding:9px 6px;text-align:center;font-weight:600}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:first-child{border-radius:12px 0 0 12px;font-weight:800;color:var(--muted);width:40px}.tbl td:last-child{border-radius:0 12px 12px 0;font-weight:800}
.tbl tr.me td{background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.tbl tr.me td:first-child{box-shadow:inset 4px 0 0 var(--gold);color:var(--accent)}.tbl tr.me td:nth-child(2){color:var(--accent);font-weight:800}
.dempty{margin:auto;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px;padding:22px;max-width:46ch;line-height:1.5}
.dempty b{display:block;color:var(--text);margin-bottom:4px}.dempty code{display:block;margin:8px 0 12px;font-size:12px}
@media (max-width:1100px){.tbl .hx{display:none}}
@media (max-width:760px){.detail{overflow-y:auto}.dwrap{height:auto;min-height:100%}.tiles{grid-template-columns:repeat(2,1fr)}.dgrid,.dside{grid-template-columns:1fr;grid-template-rows:none}.dscroll{max-height:60vh}}
@media (max-height:820px) and (min-width:761px){.dtitle{font-size:clamp(30px,4.6vw,54px)}.tile{padding:8px 14px}.tile b{font-size:clamp(18px,2.2vw,26px)}.dline{margin-top:6px}.dcomp{margin-top:2px}}
</style>
</head>
<body>

  var have={};AUTO.escaloes.forEach(function(e){have[norm(e.nome)]=1;if(ord.map(norm).indexOf(norm(e.nome))<0)ord.push(e.nome)});
  ESCORD=ord;
  return autoGames(AUTO).concat(man.filter(function(g){return!have[norm(g.esc)]})).sort(function(a,b){return a.dt-b.dt})}
function loadAuto(){
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.escaloes||!d.escaloes.length)return;
    var mudou=!AUTO||AUTO.atualizado!==d.atualizado;AUTO=d;
    if(d.atualizado){var u=new Date(d.atualizado);$("sub").textContent="Jogos · todos os escalões · atualizado a "+u.getDate()+"/"+pad(u.getMonth()+1)}
    if(mudou&&!detailOpen)refresh(true)}).catch(function(){})}
function refresh(keep){if(!keep)pi=0;games=allGames();build(true);hero();clock();sponsors()}

function shrink(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var k=Math.min(1,420/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/png"))};im.src=r.result};r.readAsDataURL(f)})}
var draft=[];
function thumbs(){$("thumbs").innerHTML=draft.map(function(s,i){return'<div><img src="'+s+'" alt=""><button data-i="'+i+'" aria-label="Remover">×</button></div>'}).join("")||'<span style="color:var(--muted);font-size:13px">Sem imagens ainda.</span>'}
$("thumbs").onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i!==null&&i!==undefined){draft.splice(+i,1);thumbs()}};
$("addSp").onclick=function(){$("file").click()};
$("file").onchange=function(){Promise.all(Array.prototype.map.call(this.files,shrink)).then(function(a){draft=draft.concat(a);thumbs()});this.value=""};
$("gear").onclick=function(){$("iClub").value=ST.club;$("iGames").value=ST.games;$("iTables").value=ST.tables||"";draft=ST.sp.slice();thumbs();$("dlg").showModal()};
$("close").onclick=function(){$("dlg").close()};
$("save").onclick=function(){ST.club=$("iClub").value.trim();ST.games=$("iGames").value;ST.tables=$("iTables").value;ST.sp=draft;sv();$("dlg").close();refresh()};
var th=["auto","light","dark"],ti=0;
$("theme").onclick=function(){ti=(ti+1)%3;var r=document.documentElement;if(th[ti]==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",th[ti]);this.textContent="Tema: "+th[ti]};

ld();if(!ST.games){ST.games=defaults()}
refresh();loadAuto();setInterval(loadAuto,30*60*1000);setInterval(clock,1000);setInterval(function(){build();hero()},60000);
})();
</script>
</body>
